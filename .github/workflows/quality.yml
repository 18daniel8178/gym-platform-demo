# Quality gates: every job must pass before merging to main.
# Lint (zero warnings), server tests (node --test), SQL migrations applied twice
# against a throwaway Postgres, and a production build of the client.
name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      # import-x/no-unresolved resolves against each workspace's node_modules,
      # so client/ and server/ dependencies must be installed too.
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm ci --prefix server
      - name: ESLint (--max-warnings=0)
        run: npx eslint . --max-warnings=0

  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  migrations:
    name: SQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Applies every migration on a clean Postgres, applies it again
      # (idempotency) and runs the SQL test cases the server relies on.
      - name: Verify migrations against Postgres
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash server/db/pruebas/verificar-migracion.sh

  client-build:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
